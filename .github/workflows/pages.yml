name: Build and deploy Future Archive

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: future-archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test catalog and Pages paths
        run: npm test
      - name: Build and pre-render the React gallery
        run: npm run build
      - name: Verify every artwork and production asset
        run: node scripts/verify-dist.mjs
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test desktop, mobile, keyboard, and no-JavaScript flows
        run: npm run test:e2e
      - name: Upload Pages build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check the repository's one-time Pages setting
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const response=await fetch('https://api.github.com/repos/'+process.env.GH_REPOSITORY+'/pages',{
            headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          });
          if(!response.ok&&response.status!==404)throw new Error('Unable to inspect Pages configuration: HTTP '+response.status);
          const data=response.ok?await response.json():null;
          const ready=data?.build_type==='workflow';
          appendFileSync(process.env.GITHUB_OUTPUT,'ready='+ready+'\n');
          if(!ready){
            const settings='https://github.com/'+process.env.GH_REPOSITORY+'/settings/pages';
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## GitHub Pages needs its one-time setup\n\nThe React gallery and browser checks passed. Choose **Settings → Pages → Source → GitHub Actions**, then run this workflow again.\n\n'+settings+'\n');
            console.log('::notice::Pages publication is waiting for Settings → Pages → Source → GitHub Actions.');
          }
          NODE
      - name: Configure Pages
        if: steps.pages.outputs.ready == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Publish to GitHub Pages
        if: steps.pages.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
